name: CodeQL

# PR gating is handled by CI + SwiftLint; the ~25-minute traced Swift build
# makes CodeQL too slow for every PR push. Runs on master (code changes only)
# and weekly.
on:
  push:
    branches: [master]
    paths:
      - '**.swift'
      - 'project.yml'
      - '.github/workflows/codeql.yml'
  schedule:
    - cron: '0 8 * * 1'  # Every Monday 08:00 UTC

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-15
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      # Install xcodegen BEFORE CodeQL init.
      # brew install fails under Rosetta after CodeQL modifies the shell
      # environment for Swift tracing, so xcodegen must be installed first.
      - name: Install xcodegen
        run: brew install xcodegen

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          languages: swift

      - name: Generate Xcode project
        run: xcodegen generate

      # Same path + key as ci.yml, so this job reuses the cache CI populates.
      # Only the package downloads are cached (notably the rust-nostr binary);
      # all sources still compile every run, which CodeQL's tracer requires.
      - name: Cache SPM packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: .spm-packages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Build
        run: |
          xcodebuild build \
            -project NOTE.xcodeproj \
            -scheme NOTE \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -clonedSourcePackagesDirPath .spm-packages \
            CODE_SIGNING_ALLOWED=NO

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # v4
        with:
          category: "/language:swift"
